name: Validate Indian Wars archive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check campaigns.js
          node --check war-studies.js
          node --check data.js
          node --check scripts/validate-archive.js
      - name: Validate archive structure
        run: node scripts/validate-archive.js